services:
  - type: web
    name: ucsm-certificates
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: |
      npm install
      npm --prefix server install
      npm --prefix client install
      npm --prefix client run build
      npm --prefix server run build
    startCommand: npm --prefix server run start
    healthCheckPath: /api/public/settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SIGNING_KEY_PASSPHRASE
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        fromService:
          name: ucsm-certificates
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VERIFY_BASE_URL
        fromService:
          name: ucsm-certificates
          type: web
          envVarKey: RENDER_EXTERNAL_URL
